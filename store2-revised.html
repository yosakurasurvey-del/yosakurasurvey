<!--Store2 　牛かつ世桜　長堀橋店　修正版-->

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ご来店アンケート</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Noto+Sans:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:       #262220;
  --ink-mid:   #3A342E;
  --sub:       #948C82;
  --border:    #E7E2D9;
  --border-lt: #F0ECE4;
  --bg:        #FFFFFF;
  --card:      #FFFFFF;
  --field:     #FCFBF9;
  --accent:    #B5533D;
  --accent-dk: #8B3F2C;
  --accent-soft:#F5E1D8;
  --white:     #FFFFFF;
}

body {
  min-height: 100vh;
  background: var(--bg);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 12px 24px;
  font-family: 'Cormorant Garamond', 'Noto Sans JP', 'Noto Sans KR', 'Noto Sans SC', 'Noto Sans TC', 'Noto Sans', sans-serif;
  color: var(--ink);
}

/* 中国語・韓国語表示時、選択肢内の英字(Instagram, Naverなど)だけ少し太くして、
   中国語/韓国語の文字との視覚的な太さのギャップを軽減する */
.opt b.src-en {
  font-weight: 600;
}

/* ── Card ── */
.card {
  width: 100%;
  max-width: 560px;
  margin-top: 24px;
}

/* ── Tablet / iPad (portrait, e.g. iPad mini/Air/Pro portrait) ── */
@media (min-width: 601px) and (max-width: 1024px) {
  .card { max-width: 820px; }
  .card-inner { padding: 68px 76px 60px; }

  .logo-wrap { margin-bottom: 36px; }
  .logo-img { max-width: 320px; max-height: 150px; }

  .mon { font-size: 40px; margin-bottom: 18px; }
  .title-ja { font-size: 38px; font-weight: 500; margin-bottom: 12px; }
  .title-sub { font-size: 22px; }

  .progress-wrap { margin-bottom: 46px; }
  .step-circle { width: 46px; height: 46px; font-size: 18px; }
  .step-label { font-size: 16px; }
  .progress-steps { padding-bottom: 34px; }
  .step-connector { max-width: 64px; }

  .q-label { font-size: 19px; margin-bottom: 18px; }
  .q-text { font-size: 33px; font-weight: 500; margin-bottom: 14px; }
  .optional-tag { font-size: 17px; margin-bottom: 28px; }

  .opt { padding: 20px 26px; font-size: 25px; gap: 18px; font-weight: 500; }
  .other-input { padding: 18px 20px; font-size: 22px; }

  .rating-row { gap: 16px; }
  .rating-opt { padding: 18px 8px 20px; }
  .rating-opt img { max-width: 92px; }
  .rating-opt .rating-num { font-size: 17px; font-weight: 500; }

  .feedback-area { font-size: 23px; min-height: 170px; padding: 18px 20px; }

  .nav { margin-top: 38px; gap: 16px; }
  .btn-back { padding: 18px 30px; font-size: 21px; }
  .btn-next { padding: 20px; font-size: 21px; }

  .ty-main { font-size: 38px; }
  .ty-sub { font-size: 21px; }
  .ty-face { width: 96px; height: 96px; }
  /* max-width は基本ルールの 25% を継承（画面幅に応じて自動で拡大縮小） */
}

/* ── iPad landscape / larger tablet ／ PC(パソコン)サイズにも同じ拡大レイアウトを適用 ── */
@media (min-width: 1025px) {
  .card { max-width: 940px; }
  .card-inner { padding: 76px 92px 68px; }

  .logo-wrap { margin-bottom: 40px; }
  .logo-img { max-width: 360px; max-height: 170px; }

  .mon { font-size: 44px; margin-bottom: 20px; }
  .title-ja { font-size: 42px; font-weight: 500; margin-bottom: 14px; }
  .title-sub { font-size: 23px; }

  .progress-wrap { margin-bottom: 50px; }
  .step-circle { width: 48px; height: 48px; font-size: 19px; }
  .step-label { font-size: 17px; }
  .progress-steps { padding-bottom: 36px; }
  .step-connector { max-width: 70px; }

  .q-label { font-size: 20px; margin-bottom: 20px; }
  .q-text { font-size: 36px; font-weight: 500; margin-bottom: 16px; }
  .optional-tag { font-size: 18px; margin-bottom: 30px; }

  .opt { font-size: 27px; padding: 22px 28px; gap: 20px; font-weight: 500; }
  .other-input { padding: 19px 22px; font-size: 23px; }

  .rating-row { gap: 18px; }
  .rating-opt { padding: 20px 10px 22px; }
  .rating-opt img { max-width: 108px; }
  .rating-opt .rating-num { font-size: 18px; font-weight: 500; }

  .feedback-area { font-size: 24px; min-height: 180px; padding: 19px 22px; }

  .nav { margin-top: 40px; gap: 18px; }
  .btn-back { padding: 19px 32px; font-size: 22px; }
  .btn-next { padding: 21px; font-size: 22px; }

  .ty-main { font-size: 40px; }
  .ty-sub { font-size: 22px; }
  .ty-face { width: 104px; height: 104px; }
  /* max-width は基本ルールの 25% を継承（画面幅に応じて自動で拡大縮小） */
}

.card-inner { padding: 40px 40px 36px; }
@media(max-width:480px){ .card-inner { padding: 30px 22px 26px; } }

/* ── Logo ── */
.logo-wrap { text-align: center; margin-bottom: 22px; }
.logo-img {
  display: block;
  margin: 0 auto;
  max-width: 200px;
  max-height: 90px;
  object-fit: contain;
}

/* ── Header ── */
.header { text-align: center; margin-bottom: 34px; }
.mon { font-size: 28px; color: var(--accent); line-height: 1; margin-bottom: 10px; letter-spacing: .08em; }
.title-ja {
  font-size: 25px;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: .14em;
  margin-bottom: 4px;
}
.title-sub {
  font-size: 15px;
  color: var(--sub);
  letter-spacing: .1em;
  font-style: italic;
}
.divider {
  display: flex; align-items: center; gap: 12px;
  margin: 16px 0;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border));
}
.divider::after { background: linear-gradient(270deg, transparent, var(--border)); }
.divider-dot { width: 5px; height: 5px; background: var(--accent); border-radius: 50%; flex-shrink: 0; }

/* ── Progress ── */
.progress-wrap { margin-bottom: 30px; }
.progress-steps {
  display: flex; justify-content: center; gap: 0; align-items: center;
  padding-bottom: 26px;
}
.step-node {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  position: relative;
}
.step-circle {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: var(--sub);
  transition: all .4s ease;
  background: var(--white);
  position: relative; z-index: 1;
}
.step-circle.done {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--white);
}
.step-circle.active {
  border-color: var(--accent);
  color: var(--accent-dk);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.step-label {
  font-size: 11px; color: var(--sub); letter-spacing: .06em;
  white-space: nowrap;
  transition: color .3s;
  text-align: center;
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  margin-top: 6px;
}
.step-node:not(.active) .step-label { display: none; }
.step-node.active .step-label { color: var(--accent-dk); }
.step-connector {
  flex: 1; height: 1px;
  background: var(--border);
  min-width: 8px; max-width: 46px;
}

/* ── Slide viewport ── */
.slide-viewport { overflow: hidden; position: relative; }

.slide {
  display: none;
  animation: slideIn .45s cubic-bezier(.16,1,.3,1) forwards;
}
.slide.active { display: block; }
.slide.exit {
  display: block;
  animation: slideOut .35s cubic-bezier(.4,0,1,1) forwards;
  pointer-events: none;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateX(28px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes slideOut {
  from { opacity: 1; transform: translateX(0); }
  to   { opacity: 0; transform: translateX(-28px); }
}

/* ── Question ── */
.q-label {
  font-size: 12px;
  letter-spacing: .13em;
  color: var(--accent-dk);
  text-transform: uppercase;
  margin-bottom: 10px;
  display: block;
}
.q-text {
  font-size: 22px;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: .04em;
  margin-bottom: 6px;
  line-height: 1.5;
}
.optional-tag {
  font-size: 14px;
  color: var(--sub);
  font-style: italic;
  margin-bottom: 18px;
}

/* ── Options grid ── */
.options { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: all .2s;
  background: var(--field);
  color: var(--ink-mid);
  font-family: inherit;
  font-size: 17px;
  font-weight: 500;
  letter-spacing: .02em;
  text-align: left;
  width: 100%;
  position: relative;
  overflow: hidden;
}
.opt::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--accent);
  transform: scaleY(0);
  transition: transform .2s;
}
.opt:hover { border-color: var(--accent); background: var(--white); }
.opt:hover::before { transform: scaleY(1); }
.opt.selected {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--ink);
}
.opt.selected::before { transform: scaleY(1); }

/* 人数など、短い選択肢を並べるグリッド */
.options.grid { display: grid; grid-template-columns: repeat(3, 1fr); }
.options.grid .opt { justify-content: center; }

/* Other free-text input */
.other-input-wrap { margin-top: 10px; }
.other-input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 11px 14px;
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
  background: var(--field);
  outline: none;
  transition: border-color .2s;
}
.other-input:focus { border-color: var(--accent); }
.other-input::placeholder { color: var(--sub); font-style: italic; }

/* Rating (square images instead of stars) */
.rating-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}
.rating-opt {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 10px 4px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  background: var(--field);
  transition: all .2s;
  font-family: inherit;
  min-width: 0;
}
.rating-opt img {
  width: 100%;
  max-width: 52px;
  aspect-ratio: 1 / 1;
  object-fit: contain;
  display: block;
  filter: grayscale(100%);
  opacity: .55;
  transition: opacity .2s, transform .2s;
}
.rating-opt .rating-num { font-size: 12px; color: var(--sub); letter-spacing: .02em; text-align: center; }
.rating-opt:hover { border-color: var(--accent); background: var(--white); }
.rating-opt:hover img { opacity: .8; }
.rating-opt.selected { border-color: var(--accent); background: var(--accent-soft); }
.rating-opt.selected img { opacity: 1; transform: scale(1.06); }
.rating-opt.selected .rating-num { color: var(--ink-mid); }
@media (max-width: 380px) {
  .rating-row { gap: 4px; }
  .rating-opt { padding: 8px 2px 10px; }
}

/* Textarea */
.feedback-area {
  width: 100%; min-height: 130px;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 13px 15px;
  font-family: inherit;
  font-size: 17px;
  color: var(--ink);
  background: var(--field);
  resize: vertical;
  outline: none;
  transition: border-color .2s;
  letter-spacing: .02em;
  line-height: 1.7;
}
.feedback-area:focus { border-color: var(--accent); }
.feedback-area::placeholder { color: var(--sub); font-style: italic; }

/* ── Nav buttons ── */
.nav { display: flex; gap: 10px; margin-top: 26px; }
.btn-back {
  padding: 13px 22px;
  background: none;
  border: 1px solid var(--border);
  color: var(--sub);
  border-radius: 8px;
  font-family: inherit;
  font-size: 16px;
  letter-spacing: .08em;
  cursor: pointer;
  transition: all .2s;
}
.btn-back:hover { border-color: var(--sub); color: var(--ink-mid); }
.btn-next {
  flex: 1;
  padding: 15px;
  background: var(--accent);
  border: none;
  color: var(--white);
  border-radius: 8px;
  font-family: inherit;
  font-size: 16px;
  letter-spacing: .12em;
  cursor: pointer;
  transition: all .25s;
  font-weight: 500;
}
.btn-next:hover { background: var(--accent-dk); }
.btn-next:disabled { opacity: .35; cursor: not-allowed; }

/* ── Thank you screen ── */
.thankyou {
  display: none;
  position: relative;
  text-align: center;
  padding: 20px 0 10px;
  overflow: hidden;
}
.thankyou.show { display: block; }

/* Falling sakura petals layer (sits behind the text/logo content) */
.sakura-layer {
  position: absolute;
  inset: -20px 0 0 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}
.sakura-layer .petal {
  position: absolute;
  top: -24px;
  width: var(--size, 10px);
  height: var(--size, 10px);
  background: linear-gradient(135deg, #F6C9D3 0%, #E9A6B6 60%, var(--accent) 130%);
  border-radius: 0% 60% 0% 60%;
  opacity: 0;
  animation: sakuraFall var(--dur, 5s) linear var(--delay, 0s) forwards;
}
@keyframes sakuraFall {
  0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
  10%  { opacity: .55; }
  50%  { transform: translate(var(--drift, 24px), 190px) rotate(calc(var(--rot, 260deg) / 2)); }
  90%  { opacity: .4; }
  100% { transform: translate(calc(var(--drift, 24px) * -1), 380px) rotate(var(--rot, 260deg)); opacity: 0; }
}

.ty-rule,
.ty-main,
.ty-sub,
.ty-face,
.ty-logo-all {
  position: relative;
  z-index: 1;
}

.ty-face {
  display: block;
  margin: 18px auto 0;
  width: 60px;
  height: 60px;
  object-fit: contain;
  filter: grayscale(100%);
  opacity: 0;
  transform: translateY(8px) scale(.8);
  transition: opacity .6s ease, transform .6s cubic-bezier(.16,1,.3,1);
}
.ty-face.visible { opacity: 1; transform: translateY(0) scale(1); }

.ty-logo-all {
  display: block;
  margin: 32px auto 0;
  max-width: 25%;
  width: 100%;
  height: auto;
  opacity: 0;
  transform: translateY(14px);
  transition: opacity 1.1s ease, transform 1.1s ease;
}
.ty-logo-all.visible { opacity: 1; transform: translateY(0); }

.ty-rule {
  width: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  margin: 0 auto 22px;
  transition: width 1s ease .3s;
}
.ty-rule.visible { width: 70%; }

.ty-main {
  font-size: 26px;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: .12em;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity .7s ease .5s, transform .7s ease .5s;
  margin-bottom: 10px;
}
.ty-main.visible { opacity: 1; transform: translateY(0); }

.ty-sub {
  font-size: 14px;
  color: var(--sub);
  letter-spacing: .1em;
  font-style: italic;
  opacity: 0;
  transition: opacity .7s ease .8s;
}
.ty-sub.visible { opacity: 1; }

.ty-smiley {
  font-size: 30px;
  margin-top: 18px;
  opacity: 0;
  transform: translateY(8px) scale(.8);
  transition: opacity .6s ease, transform .6s cubic-bezier(.16,1,.3,1);
}
.ty-smiley.visible { opacity: 1; transform: translateY(0) scale(1); }

@media (prefers-reduced-motion: reduce) {
  .slide, .ty-main, .ty-rule, .ty-face, .ty-logo-all { animation: none !important; transition: none !important; }
  .sakura-layer .petal { animation: none !important; opacity: 0 !important; }
}

</style>
</head>
<body>

<div class="card">
  <div class="card-inner">

    <!-- Logo: 下の LOGO_URL にロゴ画像のURL（またはファイルパス）を設定すると、ここにロゴが表示されます -->
    <div class="logo-wrap" id="logoWrap">
      <a href="store2-revised.html"><img class="logo-img" id="logoImg" alt="Logo"></a>
    </div>

    <!-- Header -->
    <div class="header">
      <div class="title-ja" id="headerTitle">ご来店アンケート</div>
      <div class="title-sub" id="headerSub">Customer Satisfaction Survey</div>
      <div class="divider"><div class="divider-dot"></div></div>
    </div>

    <!-- Progress -->
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-steps" id="progressSteps"></div>
    </div>

    <!-- Slides -->
    <div class="slide-viewport" id="slideViewport">

      <!-- Q1: 国 -->
      <div class="slide active" id="slide-0">
        <span class="q-label" id="ql-0"></span>
        <div class="q-text" id="qt-0"></div>
        <div class="options" id="opts-0"></div>
        <div class="other-input-wrap" id="countryOtherWrap" style="display:none;">
          <input type="text" class="other-input" id="countryOtherInput">
        </div>
        <div class="nav" id="nav-0" style="display:none;">
          <button class="btn-next" id="btn-0" onclick="next(0)"></button>
        </div>
      </div>

      <!-- Q2: 人数 -->
      <div class="slide" id="slide-1">
        <span class="q-label" id="ql-1"></span>
        <div class="q-text" id="qt-1"></div>
        <div class="options grid" id="opts-1"></div>
        <div class="nav"><button class="btn-back" onclick="back(1)">←</button></div>
      </div>

      <!-- Q3: 性別 -->
      <div class="slide" id="slide-2">
        <span class="q-label" id="ql-2"></span>
        <div class="q-text" id="qt-2"></div>
        <div class="options" id="opts-2"></div>
        <div class="nav"><button class="btn-back" onclick="back(2)">←</button></div>
      </div>

      <!-- Q4: 年代 -->
      <div class="slide" id="slide-3">
        <span class="q-label" id="ql-3"></span>
        <div class="q-text" id="qt-3"></div>
        <div class="options" id="opts-3"></div>
        <div class="nav"><button class="btn-back" onclick="back(3)">←</button></div>
      </div>

      <!-- Q5: お店を知ったきっかけ -->
      <div class="slide" id="slide-4">
        <span class="q-label" id="ql-4"></span>
        <div class="q-text" id="qt-4"></div>
        <div class="options" id="opts-4"></div>
        <div class="nav"><button class="btn-back" onclick="back(4)">←</button></div>
      </div>

      <!-- Q6: 実際に使った媒体（Q5の回答によって選択肢が変わる） -->
      <div class="slide" id="slide-5">
        <span class="q-label" id="ql-5"></span>
        <div class="q-text" id="qt-5"></div>
        <div class="options" id="opts-5"></div>
        <div class="nav"><button class="btn-back" onclick="back(5)">←</button></div>
      </div>

      <!-- Q7: 予約を完了した媒体 -->
      <div class="slide" id="slide-6">
        <span class="q-label" id="ql-6"></span>
        <div class="q-text" id="qt-6"></div>
        <div class="options" id="opts-6"></div>
        <div class="nav">
          <button class="btn-back" onclick="back(6)">←</button>
          <button class="btn-next" id="btn-6" onclick="submitSurvey()" disabled></button>
        </div>
      </div>

    </div>

    <!-- Thank you -->
    <div class="thankyou" id="thankyou">
      <div class="sakura-layer" id="sakuraLayer"></div>
      <div class="ty-rule" id="tyRule"></div>
      <div class="ty-main" id="tyMain"></div>
      <div class="ty-sub" id="tySub"></div>
      <img class="ty-logo-all" id="tyLogoAll" alt="">
    </div>

  </div>
</div>

<script>
// ─── Logo ────────────────────────────────────────────────
const LOGO_URL     = "images/Wagyukatsu.png";
const LOGO_ALL_URL = "images/logo_all.png";
if (LOGO_URL) {
  document.getElementById('logoImg').src = LOGO_URL;
} else {
  document.getElementById('logoWrap').style.display = 'none';
}
if (LOGO_ALL_URL) {
  document.getElementById('tyLogoAll').src = LOGO_ALL_URL;
}

// ─── 国リスト（表示順・全言語共通） ─────────────────────────
// I18N[lang].countryNames は、この並びと同じ順番で並べてあります。
const COUNTRY_CODES = ['AU','CA','CN','FR','DE','HK','IN','ID','IT','JP','MY','PH','SG','KR','TW','TH','GB','US','VN','OTHER'];

// 送信時刻を「日本時間(JST)」の文字列に変換して取得する
function getJSTTimestamp() {
  const parts = new Intl.DateTimeFormat('ja-JP', {
    timeZone: 'Asia/Tokyo',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    hour12: false,
  }).formatToParts(new Date());
  const get = (type) => parts.find(p => p.type === type).value;
  return `${get('year')}/${get('month')}/${get('day')} ${get('hour')}:${get('minute')}:${get('second')}`;
}

// ─── Helpers ─────────────────────────────────────────────
function t() { return I18N[lang]; }
function countryLabel(i) { return COUNTRY_FLAGS[i] + '　' + t().countryNames[i]; }

function renderAll() {
  const tr = t();
  document.getElementById('headerTitle').textContent = tr.headerTitle;
  document.getElementById('headerSub').textContent   = tr.headerSub;
  renderProgress();
  renderSlide0();
  renderSlide1();
  renderSlide2();
  renderSlide3();
  renderSlide4();
  renderSlide5();
  renderSlide6();
}

function updateQLabel(slideIdx) {
  const tr = t();
  const el = document.getElementById('ql-' + slideIdx);
  if (el) el.textContent = tr.qPrefix + String(slideIdx + 1).padStart(2, '0') + tr.qSuffix;
}

function renderProgress() {
  const tr = t();
  const ps = document.getElementById('progressSteps');
  ps.innerHTML = '';
  for (let i = 0; i <= LAST_SLIDE; i++) {
    const node = document.createElement('div');
    node.className = 'step-node' + (i === current ? ' active' : '');
    const circle = document.createElement('div');
    circle.className = 'step-circle' + (i < current ? ' done' : i === current ? ' active' : '');
    if (i < current) {
      circle.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"></polyline></svg>';
    } else {
      circle.textContent = String(i + 1);
    }
    const label = document.createElement('div');
    label.className = 'step-label';
    label.textContent = tr.stepsLabels[i];
    node.appendChild(circle);
    node.appendChild(label);
    ps.appendChild(node);
    if (i < LAST_SLIDE) {
      const conn = document.createElement('div');
      conn.className = 'step-connector';
      ps.appendChild(conn);
    }
  }
}

// 文字列中の英字(ラテン文字)の連続部分だけを<b class="src-en">で囲む
function boldenLatin(str) {
  return str.replace(/[A-Za-z0-9][A-Za-z0-9 .&-]*[A-Za-z0-9]|[A-Za-z0-9]/g, m => `<b class="src-en">${m}</b>`);
}

// 中国語・韓国語表示のときだけ、英字部分(Instagram, Tabelogなど)を少し太くする
function setOptLabel(btn, text) {
  if (lang === 'zh-hans' || lang === 'zh-hant' || lang === 'ko') {
    btn.innerHTML = boldenLatin(text);
  } else {
    btn.textContent = text;
  }
}

// 単一選択のスライドを描画する共通処理
function renderChoice(slideIdx, labels, selectedIdx, onPick) {
  updateQLabel(slideIdx);
  document.getElementById('qt-' + slideIdx).textContent = t().questions[slideIdx];
  const container = document.getElementById('opts-' + slideIdx);
  container.innerHTML = '';
  labels.forEach((text, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt' + (selectedIdx === i ? ' selected' : '');
    setOptLabel(btn, text);
    btn.onclick = () => onPick(i);
    container.appendChild(btn);
  });
}

// ─── Q1: 国 ──────────────────────────────────────────────
function renderSlide0() {
  const tr = t();
  updateQLabel(0);
  document.getElementById('qt-0').textContent = tr.questions[0];
  const container = document.getElementById('opts-0');
  container.innerHTML = '';
  COUNTRY_CODES.forEach((code, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt' + (answers.countryIndex === i ? ' selected' : '');
    btn.textContent = countryLabel(i);
    btn.onclick = () => {
      answers.countryIndex = i;
      const newLang = langForCountryIndex(i);
      const isOtherChoice = code === 'OTHER';

      Array.from(container.children).forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');

      if (isOtherChoice) {
        // 「その他」を選んだ場合はこの画面に留まるため、すぐに言語を切り替える
        lang = newLang;
        renderAll();
      } else {
        // 選んだ瞬間に次の質問へ。言語の切り替えは、前の画面が隠れ終わった直後に行う
        setTimeout(() => {
          next(0, () => {
            lang = newLang;
            renderAll();
          });
        }, 220);
      }
    };
    container.appendChild(btn);
  });

  const isOther = answers.countryIndex !== null && COUNTRY_CODES[answers.countryIndex] === 'OTHER';
  const otherWrap  = document.getElementById('countryOtherWrap');
  const otherInput = document.getElementById('countryOtherInput');
  otherWrap.style.display = isOther ? 'block' : 'none';
  otherInput.placeholder = tr.otherInputPlaceholder;
  otherInput.value = answers.countryOther;
  otherInput.oninput = (e) => { answers.countryOther = e.target.value; };

  document.getElementById('nav-0').style.display = isOther ? 'flex' : 'none';
  document.getElementById('btn-0').textContent = tr.nextBtn;
}

    setTimeout(() => next(1), 220);
  });
}

  renderChoice(3, AGE_LABELS, answers.ageIndex, (i) => {
    answers.ageIndex = i;
    renderSlide3();
    setTimeout(() => next(3), 220);
  });
}

// ─── Q5: お店を知った主なきっかけ ─────────────────────────
function renderSlide4() {
  renderChoice(4, t().sources, answers.sourceIndex, (i) => {
    // きっかけを変更した場合、Q6(媒体)の回答はリセットする
    if (answers.sourceIndex !== i) answers.mediumIndex = null;
    answers.sourceIndex = i;
    renderSlide4();
    renderSlide5();
    setTimeout(() => next(4), 220);
  });
}

// ─── Q6: 実際に使った媒体（Q5の回答で選択肢が変わる） ─────────
function renderSlide5() {
  const key = answers.sourceIndex === null ? null : SOURCE_KEYS[answers.sourceIndex];
  const labels = key ? t().media[key] : [];
  renderChoice(5, labels, answers.mediumIndex, (i) => {
    answers.mediumIndex = i;
    renderSlide5();
    setTimeout(() => next(5), 220);
  });
}

// ─── Q7: 予約を完了した媒体（最後の質問。選択後に「完了」ボタンで送信） ──
function renderSlide6() {
  renderChoice(6, t().reservations, answers.reserveIndex, (i) => {
    answers.reserveIndex = i;
    renderSlide6();
  });
  const btn = document.getElementById('btn-6');
  btn.textContent = t().submitBtn;
  btn.disabled = answers.reserveIndex === null;
}

// ─── Navigation ───────────────────────────────────────────
function navigate(from, to, beforeShow) {
  const fromEl = document.getElementById('slide-' + from);
  const toEl   = document.getElementById('slide-' + to);
  const forward = to > from;

  fromEl.style.animation = '';
  fromEl.style.animationName = forward ? 'slideOut' : 'slideOutReverse';
  fromEl.classList.add('exit');

  setTimeout(() => {
    fromEl.classList.remove('active', 'exit');
    fromEl.style.animation = '';
    if (beforeShow) beforeShow();
    if (!forward) {
      toEl.style.animation = 'slideInReverse .45s cubic-bezier(.16,1,.3,1) forwards';
    }
    toEl.classList.add('active');
    current = to;
    renderProgress();
    if (!forward) {
      setTimeout(() => { toEl.style.animation = ''; }, 500);
    }
  }, 350);
}

// Extra keyframes for the "back" direction
const styleEl = document.createElement('style');
styleEl.textContent = `
  @keyframes slideOutReverse {
    from { opacity:1; transform:translateX(0); }
    to   { opacity:0; transform:translateX(28px); }
  }
  @keyframes slideInReverse {
    from { opacity:0; transform:translateX(-28px); }
    to   { opacity:1; transform:translateX(0); }
  }
`;
document.head.appendChild(styleEl);

function next(step, beforeShow) { navigate(step, step + 1, beforeShow); }
function back(step) { navigate(step, step - 1); }

// ─── Submit ───────────────────────────────────────────────
async function submitSurvey() {
  const btn = document.getElementById('btn-' + LAST_SLIDE);
  btn.disabled = true;
  btn.textContent = '…';

  // スプレッドシートには、回答言語に関わらず集計しやすい形で記録する
  //  ・国名は英語（「その他」は自由記入内容を括弧書きで付ける）
  //  ・それ以外の選択肢は日本語の表記
  const en = I18N.en, ja = I18N.ja;
  const isOtherCountry = answers.countryIndex !== null && COUNTRY_CODES[answers.countryIndex] === 'OTHER';
  const countryText = answers.countryIndex === null ? '' :
    (isOtherCountry && answers.countryOther
      ? `${en.countryNames[answers.countryIndex]}（${answers.countryOther}）`
      : en.countryNames[answers.countryIndex]);

  const sourceKey = answers.sourceIndex === null ? null : SOURCE_KEYS[answers.sourceIndex];

  const payload = {
    timestamp:   getJSTTimestamp(),
    country:     countryText,
    groupSize:   answers.groupIndex   === null ? '' : GROUP_LABELS[answers.groupIndex],
    gender:      answers.genderIndex  === null ? '' : ja.genders[answers.genderIndex],
    age:         answers.ageIndex     === null ? '' : AGE_LABELS[answers.ageIndex],
    source:      sourceKey === null ? '' : ja.sources[answers.sourceIndex],
    medium:      (sourceKey === null || answers.mediumIndex === null) ? '' : ja.media[sourceKey][answers.mediumIndex],
    reservation: answers.reserveIndex === null ? '' : ja.reservations[answers.reserveIndex],
    lang:        lang,
  };

  try {
    await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
  } catch(e) { console.error(e); }

  showThankyou();
}

}

// 配列の要素をランダムな順序に並べ替える(Fisher–Yates)
function shuffledIndices(count) {
  const arr = Array.from({ length: count }, (_, i) => i);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function spawnPetals() {
  const container = document.getElementById('sakuraLayer');
  container.innerHTML = '';
  const count = 18;
  const cycleSpan = 4.2;

  const laneOrder  = shuffledIndices(count);
  const timeOrder  = shuffledIndices(count);
  const laneWidth  = 100 / count;
  const timeSlot   = cycleSpan / count;

  for (let i = 0; i < count; i++) {
    const span = document.createElement('span');
    span.className = 'petal';
    const size  = 6 + Math.random() * 5;
    const dur   = 4 + Math.random() * 2.8;
    const left  = laneOrder[i] * laneWidth + Math.random() * laneWidth;
    const delay = timeOrder[i] * timeSlot + Math.random() * timeSlot;
    const drift = 12 + Math.random() * 44;
    const rot   = Math.random() * 360;
    span.style.left = Math.min(99, Math.max(0, left)) + '%';
    span.style.setProperty('--size',  size + 'px');
    span.style.setProperty('--dur',   dur + 's');
    span.style.setProperty('--delay', delay + 's');
    span.style.setProperty('--drift', (Math.random() > .5 ? drift : -drift) + 'px');
    span.style.setProperty('--rot',   rot + 'deg');
    container.appendChild(span);
  }
}
